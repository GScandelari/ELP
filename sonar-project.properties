# SonarQube Cloud — análise automática (sem step de CI).
# A análise automática só honra um subconjunto de chaves deste arquivo
# (exclusões); regras de "ignore issue" precisam ser feitas na UI.

# Os testes de Security Rules (tests/rules/**) são fixtures: usam
# assertSucceeds / assertFails do @firebase/rules-unit-testing (que SÃO
# as asserções, lançam quando a regra não bate). O S2699 não reconhece
# esses helpers e marcava cada caso como BLOCKER. Fora da análise.
sonar.exclusions=tests/rules/**
