# SonarQube Cloud — análise automática (sem step de CI).
# A configuração da maior parte da análise vive na UI do SonarCloud;
# aqui ficam só os ajustes que precisam versionar com o código.

# Os testes de Security Rules (tests/rules/**) usam assertSucceeds /
# assertFails do @firebase/rules-unit-testing — esses helpers SÃO as
# asserções (lançam quando a regra não bate). O S2699 ("adicione ao
# menos uma asserção") não os reconhece; desligado para esses arquivos.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/rules/**/*
